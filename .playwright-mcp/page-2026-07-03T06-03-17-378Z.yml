      - generic [ref=f34e27]:
        - 'heading "LLM Fundamentals: How Transformers & LLMs Actually Work" [level=1] [ref=f34e28]'
        - time [ref=f34e30]: Published July 3, 2026
      - generic [ref=f34e31]:
        - heading "Introduction" [level=2] [ref=f34e32]
        - paragraph [ref=f34e33]:
          - text: Should a frontend architect understand Transformers? My answer is
          - strong [ref=f34e34]: "yes"
          - text: — not to derive the math, but to build intuition for
          - emphasis [ref=f34e35]: what the model is actually doing
          - text: ". Three reasons:"
        - list [ref=f34e36]:
          - listitem [ref=f34e37]:
            - strong [ref=f34e38]: Your prompt is not a black box.
            - text: Understanding tokenization, context window, and attention explains why “think step by step” works, and why long prompts lose their grip in the middle.
          - listitem [ref=f34e39]:
            - strong [ref=f34e40]: Production debugging demands it.
            - text: When streaming truncates, when temperature has no effect, when a function call returns malformed JSON — five minutes of root-cause beats five hours of guesswork.
          - listitem [ref=f34e41]:
            - strong [ref=f34e42]: Vendor pitches stop fooling you.
            - text: Closed vs open, 7B vs 70B, encoder-only vs decoder-only — every choice has a clear engineering trade-off, and going by gut feel is how you end up with the wrong model in production.
        - paragraph [ref=f34e43]: This is the opening post of the series. We skip the math and lean on architecture diagrams, short TypeScript snippets, and real paper citations to make the Transformer / LLM stack concrete. The next post covers tokens, context windows, and the prompt patterns that actually move the needle.
        - heading "1. Transformer — The Heart of Every Modern LLM" [level=2] [ref=f34e44]
        - paragraph [ref=f34e45]:
          - text: The skeleton of every modern LLM is the
          - strong [ref=f34e46]: Transformer architecture
          - text: ", introduced by Vaswani et al. in 2017 under the (literally) declarative title"
          - emphasis [ref=f34e47]: Attention Is All You Need
          - text: (
          - link "arXiv:1706.03762" [ref=f34e48]:
            - /url: https://arxiv.org/abs/1706.03762
          - text: ). Before it, NLP was dominated by RNNs / LSTMs that processed sequences one step at a time. Transformer replaced recurrence with a mechanism called
          - strong [ref=f34e49]: self-attention
          - text: ", which lets every position in a sequence talk directly to every other position — unlocking massive parallelization during training."
        - paragraph [ref=f34e50]: "A single Transformer decoder block (the structure used by virtually all chat LLMs) looks like this:"
        - 'figure "Figure 1: Data flow inside a Transformer decoder block" [ref=f34e52]':
          - document [ref=f34e54]:
            - generic [ref=f34e57]:
              - paragraph [ref=f34e64]: Input Tokens
              - paragraph [ref=f34e71]: Token + Positional Embedding
              - paragraph [ref=f34e78]: Masked Self-Attention
              - paragraph [ref=f34e85]: Add & Norm
              - paragraph [ref=f34e92]: Feed-Forward
              - paragraph [ref=f34e99]: Add & Norm
              - paragraph [ref=f34e106]: Output Logits
              - paragraph [ref=f34e113]: Softmax → Next Token
          - generic [ref=f34e114]: "Figure 1: Data flow inside a Transformer decoder block"
        - paragraph [ref=f34e115]: "As an architect, you only need to internalize three things:"
        - list [ref=f34e116]:
          - listitem [ref=f34e117]:
            - strong [ref=f34e118]: Self-Attention
            - text: lets every token “see” every prior token and learn a weighted summary. This is
            - emphasis [ref=f34e119]: the
            - text: mechanism behind long-range dependencies in modern LLMs.
          - listitem [ref=f34e120]:
            - strong [ref=f34e121]: Feed-Forward (FFN)
            - text: is where most factual knowledge lives. After attention aggregates context, the FFN acts like a key-value lookup over what the model has memorized.
          - listitem [ref=f34e122]:
            - strong [ref=f34e123]: Residual connections + LayerNorm
            - text: are what make 100+ layer stacks trainable at all. Without them, the gradients would never reach the early layers.
        - paragraph [ref=f34e124]:
          - text: The LLaMA paper (
          - link "arXiv:2302.13971" [ref=f34e125]:
            - /url: https://arxiv.org/abs/2302.13971
          - text: ), Qwen, DeepSeek, and every other “new” model you’re seeing in 2026 —
          - strong [ref=f34e126]: none of them escape this skeleton
          - text: ". The differences are in training data, scale, and a handful of tricks: RoPE positional encoding, SwiGLU activations, Grouped Query Attention, etc. Once you understand the Transformer, no model is a black box anymore."
        - heading "2. How an LLM Learns to Talk — The Three Training Stages" [level=2] [ref=f34e127]
        - paragraph [ref=f34e128]:
          - text: A chat model passes through
          - strong [ref=f34e129]: at least
          - text: three training stages. The clearest description is in
          - emphasis [ref=f34e130]: Training language models to follow instructions
          - text: "(Ouyang et al., OpenAI 2022, the InstructGPT paper):"
        - 'figure "Figure 2: The three-stage LLM training pipeline" [ref=f34e132]':
          - generic [ref=f34e133]:
            - paragraph [ref=f34e134]: Mermaid render error — showing source
            - code [ref=f34e136]: "flowchart LR P[Massive raw text<br/>TB-scale] --> PT[Stage 1<br/>Pretrain<br/>Next-token Prediction] PT --> SFT[Stage 2<br/>SFT<br/>Instruction tuning] SFT --> RLHF[Stage 3<br/>RLHF / DPO<br/>Align to human preferences] RLHF --> C[Chat Model]}"
            - paragraph [ref=f34e137]: "Lexical error on line 5. Unrecognized text. ...HF --> C[Chat Model]} -----------------------^"
          - generic [ref=f34e138]: "Figure 2: The three-stage LLM training pipeline"
        - 'heading "Stage 1: Pretraining" [level=3] [ref=f34e139]'
        - paragraph [ref=f34e140]:
          - text: "The model is trained on multi-terabyte corpora (web pages, books, code) with a self-supervised objective: given the first N tokens, predict token N+1. This is by far the most expensive stage — frontier-scale models reportedly cost tens to hundreds of millions of dollars. The output is a"
          - strong [ref=f34e141]: base model
          - text: ": it can continue text, but it cannot answer questions."
        - 'heading "Stage 2: Supervised Fine-Tuning (SFT)" [level=3] [ref=f34e142]'
        - paragraph [ref=f34e143]: A smaller, curated set of human-written “instruction → response” pairs (tens of thousands to a few hundred thousand) continues the training. The model shifts from “text completer” to “helpful assistant”. This stage is orders of magnitude cheaper — a few GPU-days is often enough.
        - 'heading "Stage 3: Preference Alignment (RLHF / DPO)" [level=3] [ref=f34e144]'
        - paragraph [ref=f34e145]:
          - text: Humans rank multiple candidate responses; reinforcement learning (PPO-based RLHF) or direct preference optimization (DPO) shapes the model toward safer, more helpful, brand-aligned outputs. Anthropic’s
          - emphasis [ref=f34e146]: Constitutional AI
          - text: and OpenAI’s
          - emphasis [ref=f34e147]: InstructGPT
          - text: both come from this lineage.
        - blockquote [ref=f34e148]:
          - paragraph [ref=f34e149]:
            - strong [ref=f34e150]: Pitfall.
            - text: When you browse Hugging Face, you’ll see a
            - code [ref=f34e151]: Base
            - text: model (e.g.
            - code [ref=f34e152]: Qwen2.5-7B
            - text: ) and an
            - code [ref=f34e153]: Instruct
            - text: /
            - code [ref=f34e154]: Chat
            - text: model (e.g.
            - code [ref=f34e155]: Qwen2.5-7B-Instruct
            - text: ).
            - strong [ref=f34e156]: They went through different stages.
            - text: Base models are good for continuation, classification, or embedding fine-tuning. Instruct models are what you actually want for chat.
            - strong [ref=f34e157]: In production, default to the Instruct variant
            - text: unless you have a specific fine-tuning plan.
        - heading "3. What Happens at Inference" [level=2] [ref=f34e158]
        - paragraph [ref=f34e159]:
          - text: After training, the model enters the
          - strong [ref=f34e160]: inference
          - text: (serving) stage. This is the layer you, as a frontend architect, actually touch.
        - heading "3.1 Token-by-Token Generation" [level=3] [ref=f34e161]
        - paragraph [ref=f34e162]:
          - text: The LLM produces
          - strong [ref=f34e163]: one token at a time
          - text: (roughly 1.5 Chinese characters, or ~4 English characters), appends it to the prompt, and produces the next. That’s why outputs arrive as a
          - strong [ref=f34e164]: stream
          - text: — the frontend receives chunks over SSE or WebSocket.
        - code [ref=f34e166]:
          - generic [ref=f34e167]: // Vercel AI SDK — streaming generation (production-style snippet)
          - generic [ref=f34e168]: "import { streamText } from 'ai';"
          - generic [ref=f34e169]: "import { openai } from '@ai-sdk/openai';"
          - generic [ref=f34e170]: "const result = streamText({"
          - generic [ref=f34e171]: "model: openai('gpt-4o'),"
          - generic [ref=f34e172]: "prompt: 'Explain Transformer self-attention in one sentence.',"
          - generic [ref=f34e173]: "});"
          - generic [ref=f34e174]: "for await (const chunk of result.textStream) {"
          - generic [ref=f34e175]: process.stdout.write(chunk);
          - generic [ref=f34e176]: "}"
        - 'heading "3.2 Sampling: Why the Same Prompt Gives Different Answers" [level=3] [ref=f34e177]'
        - paragraph [ref=f34e178]:
          - text: At every step, the model outputs a
          - strong [ref=f34e179]: probability distribution
          - text: "over the entire vocabulary (typically 50K–100K tokens). Picking the next token is a sampling decision:"
        - list [ref=f34e180]:
          - listitem [ref=f34e181]:
            - strong [ref=f34e182]: Greedy
            - text: — always pick the highest-probability token. Deterministic, but tends to repeat and feels flat.
          - listitem [ref=f34e183]:
            - strong [ref=f34e184]: Temperature
            - text: — values > 1 flatten the distribution (more “creative”); values < 1 sharpen it (more “focused”).
          - listitem [ref=f34e185]:
            - strong [ref=f34e186]: Top-p / Top-k
            - text: — sample only from the top-k tokens, or the smallest set whose cumulative probability reaches p. This trims the long tail of obviously bad choices.
        - paragraph [ref=f34e187]:
          - text: The Hugging Face
          - link "LLM tutorial" [ref=f34e188]:
            - /url: https://huggingface.co/docs/transformers/llm_tutorial
          - text: "walks through the practical defaults:"
          - code [ref=f34e189]: do_sample=True
          - text: +
          - code [ref=f34e190]: temperature=0.7
          - text: is a sane chat starting point.
        - heading "3.3 KV Cache — Why Long Prompts Get Expensive" [level=3] [ref=f34e191]
        - paragraph [ref=f34e192]:
          - text: Generating each new token requires re-running self-attention over the entire growing context. The standard optimization is to
          - strong [ref=f34e193]: cache the Key / Value vectors of every previous token
          - text: so each new step only computes one fresh row. This is the
          - strong [ref=f34e194]: KV cache
          - text: .
        - paragraph [ref=f34e195]:
          - text: "The cost: KV cache memory scales with"
          - code [ref=f34e196]: batch × seq_len × hidden_dim
          - text: .
          - strong [ref=f34e197]: The longer the context window, the more VRAM you burn.
          - text: This is why 200K-context models are either expensive or require aggressive optimization (PagedAttention, FlashAttention, quantization). Those techniques mitigate the problem — they don’t eliminate it.
        - heading "4. Scaling Laws — Why “Bigger” Usually Wins" [level=2] [ref=f34e198]
        - paragraph [ref=f34e199]:
          - text: A well-replicated empirical finding (
          - emphasis [ref=f34e200]: Scaling Laws for Neural Language Models
          - text: ", Kaplan et al. 2020) is that"
          - strong [ref=f34e201]: as you scale model size N, dataset size D, and compute C in lockstep, loss falls as a power law
          - text: smoothly. That’s the boring-but-true part.
        - paragraph [ref=f34e202]:
          - text: The interesting part is
          - strong [ref=f34e203]: emergent abilities
          - text: ": on tasks like multi-step reasoning or code synthesis, smaller models score near zero, then suddenly jump once a size threshold is crossed. This isn’t mysticism — it’s that scaling gives the model its first exposure to enough"
          - emphasis [ref=f34e204]: similar
          - text: examples to learn a general solution.
        - paragraph [ref=f34e205]:
          - strong [ref=f34e206]: Chinchilla
          - text: "(Hoffmann et al. 2022, DeepMind) tightened the picture further:"
          - strong [ref=f34e207]: for a fixed compute budget, model size and dataset size should grow in proportion
          - text: . That’s why everyone is now “scaling tokens” — Llama 3 pushed training data to 15T tokens, and the trend has continued through 2025–2026.
        - blockquote [ref=f34e208]:
          - paragraph [ref=f34e209]:
            - strong [ref=f34e210]: Caveat.
            - text: When a vendor says “our 1B model fine-tuned on domain data beats GPT-4” — they almost certainly mean “beats GPT-4
            - emphasis [ref=f34e211]: on a narrow benchmark we overfit to
            - text: .” On general chat, multi-step reasoning, or planning,
            - strong [ref=f34e212]: model scale still dominates
            - text: . Big isn’t always right, but be skeptical of small-model supremacy claims without broad evaluation.
        - heading "Pitfalls for Senior Architects" [level=2] [ref=f34e213]
        - list [ref=f34e214]:
          - listitem [ref=f34e215]:
            - strong [ref=f34e216]: Don’t use a base model for chat.
            - code [ref=f34e217]: Llama-3-70B
            - text: (base) and
            - code [ref=f34e218]: Llama-3-70B-Instruct
            - text: are dramatically different products. Pick the latter.
          - listitem [ref=f34e219]:
            - strong [ref=f34e220]: Don’t estimate cost by character count.
            - text: One Chinese character is usually 1–2 tokens, not 1.
            - code [ref=f34e221]: tiktoken
            - text: and provider tokenizers exist for a reason — use them to count, every time.
          - listitem [ref=f34e222]:
            - strong [ref=f34e223]: A truncated stream is not an error.
            - text: When consuming SSE, treat
            - code [ref=f34e224]: "[DONE]"
            - text: as a normal termination signal and always wrap consumption in
            - code [ref=f34e225]: try/finally
            - text: to flush buffers. Otherwise half-responses leak.
          - listitem [ref=f34e226]:
            - strong [ref=f34e227]: Don’t ask for JSON via prompt.
            - text: Use
            - strong [ref=f34e228]: tool calling / function calling / structured output
            - text: to get reliable structured data. Prompt-engineered JSON is brittle; tool-use is verified. We’ll cover this in a later post.
          - listitem [ref=f34e229]:
            - strong [ref=f34e230]: Long context ≠ better recall.
            - text: Liu et al. 2023 (
            - emphasis [ref=f34e231]: Lost in the Middle
            - text: ) showed that LLMs attend much more strongly to the beginning and end of long prompts. Put critical information at the edges.
        - heading "Summary" [level=2] [ref=f34e232]
        - paragraph [ref=f34e233]: "Five facts to anchor the rest of the series:"
        - list [ref=f34e234]:
          - listitem [ref=f34e235]:
            - strong [ref=f34e236]: Transformer
            - text: "replaced recurrence with self-attention, enabling parallel training and long-range dependencies. Foundation paper: Vaswani et al. 2017."
          - listitem [ref=f34e237]:
            - strong [ref=f34e238]: Three training stages
            - text: — pretrain → SFT → RLHF/DPO. A model is only “chat-ready” after all three.
          - listitem [ref=f34e239]:
            - strong [ref=f34e240]: Inference
            - text: is token-by-token probabilistic sampling. KV cache makes long context feasible but eats VRAM.
          - listitem [ref=f34e241]:
            - strong [ref=f34e242]: Scaling laws
            - text: explain why “bigger is better” generally holds. Emergent abilities make the investment pay off in non-obvious ways.
          - listitem [ref=f34e243]:
            - strong [ref=f34e244]: Production hygiene
            - text: ": pick Instruct variants, count tokens with the real tokenizer, always stream with proper cleanup, and prefer tool-use over prompt hacks."
        - paragraph [ref=f34e245]:
          - strong [ref=f34e246]: Next up
          - text: ":"
          - link "Tokens, Context Window & Prompt Engineering Patterns" [ref=f34e247]:
            - /url: /en/blog/tokens-context-and-prompts
          - text: — turning today’s low-level understanding into prompt patterns that actually work.
