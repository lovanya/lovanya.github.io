        - heading "踩坑提醒" [level=2] [ref=f241e427]
        - list [ref=f241e428]:
          - listitem [ref=f241e429]:
            - strong [ref=f241e430]: 永远用 strict mode + Zod 校验
            - text: 。LLM 输出永远不可信，schema 是最后的防线。
          - listitem [ref=f241e431]:
            - strong [ref=f241e432]: description 写得越清楚，调用越准
            - text: 。Description 是 LLM 唯一的”说明书”，比函数实现本身更重要。
          - listitem [ref=f241e433]:
            - strong [ref=f241e434]: 工具数控制在 20 以内
            - text: 。超出后工具选择质量断崖式下降。
          - listitem [ref=f241e435]:
            - strong [ref=f241e436]:
              - text: 必设
              - code [ref=f241e437]: stopWhen
            - text: 。没有 step 限制，循环调用可能跑满 token 配额。
          - listitem [ref=f241e438]:
            - strong [ref=f241e439]: 危险工具必须 user-approval
            - text: 。转账、删除、发邮件等不可逆操作，
            - strong [ref=f241e440]: 永远让用户确认
            - text: 。
        - heading "总结" [level=2] [ref=f241e441]
        - paragraph [ref=f241e442]: 5 个 takeaway：
        - list [ref=f241e443]:
          - listitem [ref=f241e444]:
            - strong [ref=f241e445]: Function Calling = 让 LLM 返回 JSON 描述”我要调用什么工具”，代码真正执行
            - text: 。LLM 不直接调用任何东西。
          - listitem [ref=f241e446]:
            - strong [ref=f241e447]: JSON Schema 必须严格
            - text: "：所有字段列在 required，additionalProperties: false。"
          - listitem [ref=f241e448]:
            - strong [ref=f241e449]: description = 唯一的说明书
            - text: ：决定 LLM 何时调用、怎么填参数。
          - listitem [ref=f241e450]:
            - strong [ref=f241e451]: 永远强校验
            - text: ：Zod / Pydantic 校验 + repairToolCall 修复 + 错误信息回传 LLM。
          - listitem [ref=f241e452]:
            - strong [ref=f241e453]: 危险工具必须人工审批
            - text: ：转账、删除、发邮件——Vercel AI SDK 用
