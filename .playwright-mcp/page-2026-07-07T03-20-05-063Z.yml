        - heading "踩坑提醒" [level=2] [ref=f257e411]
        - list [ref=f257e412]:
          - listitem [ref=f257e413]:
            - strong [ref=f257e414]: 不要把所有对话无差别存
            - text: 。先用 LLM 提取事实再存，控制 memory 库的”信噪比”。
          - listitem [ref=f257e415]:
            - strong [ref=f257e416]: 必须有 user 隔离
            - text: 。多租户场景 memory 必须按 user 索引 + 过滤，
            - strong [ref=f257e417]: 别等出安全事故再补
            - text: 。
          - listitem [ref=f257e418]:
            - strong [ref=f257e419]: 短期记忆用 checkpointing，长期记忆用向量库
            - text: 。不要混。
          - listitem [ref=f257e420]:
            - strong [ref=f257e421]: Memory 内容要划界 + 标注”可能不准”
            - text: 。LLM 会照单全收，幻觉记忆会污染回答。
          - listitem [ref=f257e422]:
            - strong [ref=f257e423]: 加过期机制
            - text: 。3 年前的偏好可能早就过时，定期清理。
        - heading "总结" [level=2] [ref=f257e424]
        - paragraph [ref=f257e425]: 5 个 takeaway：
        - list [ref=f257e426]:
          - listitem [ref=f257e427]:
            - strong [ref=f257e428]: 三种记忆
            - text: ：短期（当前对话）、长期（跨会话事实）、语义（提炼的抽象知识）。
          - listitem [ref=f257e429]:
            - strong [ref=f257e430]: 短期记忆
            - text: ：trim / delete / summarize 三种模式，按对话长度选。
          - listitem [ref=f257e431]:
            - strong [ref=f257e432]: 长期记忆
            - text: ：自动提取 + 向量检索是关键，
            - strong [ref=f257e433]: 不要全量塞 prompt
            - text: 。
          - listitem [ref=f257e434]:
            - strong [ref=f257e435]: Mem0 是当前开源最佳实践
            - text: ：26% 质量提升、91% 延迟降低。
          - listitem [ref=f257e436]:
            - strong [ref=f257e437]: 生产必备
            - text: ：user 隔离、内容划界、过期清理。
