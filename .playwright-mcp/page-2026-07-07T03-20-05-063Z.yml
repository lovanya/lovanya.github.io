      - generic [ref=f257e37]:
        - heading "前言" [level=2] [ref=f257e38]
        - paragraph [ref=f257e39]:
          - text: 前 3 篇我们搭了 LLM 应用的核心能力：RAG 找资料、Function Calling 调工具、Agent 自己思考决策。但所有这些都有一个前提：
          - strong [ref=f257e40]: LLM 记得上下文
          - text: 。
        - paragraph [ref=f257e41]:
          - text: 一旦用户对话超过几轮，
          - strong [ref=f257e42]: LLM 就开始”失忆”
          - text: ：
        - list [ref=f257e43]:
          - listitem [ref=f257e44]: “我们刚才说的那个项目” → LLM：“抱歉，我没看到任何项目”
          - listitem [ref=f257e45]: “你之前答应帮我改一下代码” → LLM：“我没有这个对话记录”
          - listitem [ref=f257e46]:
            - text: 用户换了设备，
            - strong [ref=f257e47]: 整个历史归零
        - paragraph [ref=f257e48]: 生产里 90% 的 LLM 应用需要”记住用户”。这一篇拆解 LLM Memory 的工程实现：
        - list [ref=f257e49]:
          - listitem [ref=f257e50]:
            - strong [ref=f257e51]: 三种记忆的区分
            - text: ：短期 / 长期 / 语义
          - listitem [ref=f257e52]:
            - strong [ref=f257e53]: 每种记忆的工程实现
          - listitem [ref=f257e54]:
            - strong [ref=f257e55]: Mem0 架构
            - text: ：开源的成熟方案
          - listitem [ref=f257e56]:
            - strong [ref=f257e57]: 生产陷阱与权衡
        - heading "一、三种 LLM 记忆" [level=2] [ref=f257e58]
        - paragraph [ref=f257e59]: 按人类记忆类比，LLM 也有 3 种：
        - figure "图 1：LLM 三种记忆" [ref=f257e61]:
          - document [ref=f257e63]:
            - generic [ref=f257e69]:
              - paragraph [ref=f257e76]:
                - text: 短期记忆
                - text: 当前对话上下文
              - paragraph [ref=f257e83]: 拼入 prompt
              - paragraph [ref=f257e90]:
                - text: 长期记忆
                - text: 跨会话事实
              - paragraph [ref=f257e97]:
                - text: 语义记忆
                - text: 从历史提炼的偏好
              - paragraph [ref=f257e104]: LLM 推理
          - generic [ref=f257e105]: 图 1：LLM 三种记忆
        - heading "1. 短期记忆（Short-term Memory）" [level=3] [ref=f257e106]
        - paragraph [ref=f257e107]:
          - strong [ref=f257e108]: 当前对话上下文
          - text: ，塞进 LLM 的 prompt。
        - code [ref=f257e110]:
          - generic [ref=f257e111]: const messages = [
          - generic [ref=f257e112]: "{ role: 'system', content: '你是客服助手' },"
          - generic [ref=f257e113]: "{ role: 'user', content: '我订单出了什么问题？' },"
          - generic [ref=f257e114]: "{ role: 'assistant', content: '订单 #123 在运输中' },"
          - generic [ref=f257e115]: "{ role: 'user', content: '什么时候到？' }, // ← LLM 看到这一句时，前文都在 context"
          - generic [ref=f257e116]: "];"
        - paragraph [ref=f257e117]:
          - strong [ref=f257e118]: 问题
          - text: ：context window 有限（4K-200K tokens），
          - strong [ref=f257e119]: 长对话会爆
          - text: 。
        - heading "2. 长期记忆（Long-term Memory）" [level=3] [ref=f257e120]
        - paragraph [ref=f257e121]:
          - strong [ref=f257e122]: 跨会话持久化的事实
          - text: ——用户偏好、历史订单、之前问过的项目。
        - code [ref=f257e124]:
          - generic [ref=f257e125]: // 用户首次对话
          - generic [ref=f257e126]: "await memoryStore.add({"
          - generic [ref=f257e127]: "userId: 'u_123',"
          - generic [ref=f257e128]: "type: 'preference',"
          - generic [ref=f257e129]: "content: '用户偏好简短回答，不要 emoji',"
          - generic [ref=f257e130]: "});"
          - generic [ref=f257e131]: // 下次新会话，prompt 里拼入
          - generic [ref=f257e132]: const memories = await memoryStore.get('u_123');
          - generic [ref=f257e133]: // → "用户偏好简短回答，不要 emoji"
        - heading "3. 语义记忆（Semantic Memory）" [level=3] [ref=f257e134]
        - paragraph [ref=f257e135]:
          - text: 从大量历史对话中
          - strong [ref=f257e136]: 提炼出的抽象知识
          - text: ——“用户经常问机票相关问题”。
        - paragraph [ref=f257e137]: 实现方式：把历史对话做 embedding 聚类，提炼出”用户主题画像”，存到向量数据库。
        - heading "二、短期记忆的工程实现：上下文窗口管理" [level=2] [ref=f257e138]
        - paragraph [ref=f257e139]:
          - text: LangChain 的
          - link "short-term memory 文档" [ref=f257e140]:
            - /url: https://docs.langchain.com/oss/python/langchain/short-term-memory
          - text: 给出 3 个核心模式：
        - heading "模式 1：Trim Messages（裁剪）" [level=3] [ref=f257e141]
        - code [ref=f257e143]:
          - generic [ref=f257e144]: "import { trimMessages } from 'langchain_core/messages';"
          - generic [ref=f257e145]: "const messages = await trimMessages(allMessages, {"
          - generic [ref=f257e146]: "maxTokens: 2000, // 最多 2000 tokens"
          - generic [ref=f257e147]: "strategy: 'last', // 保留最近的"
          - generic [ref=f257e148]: "startOn: 'human', // 必须以 user 消息开始（部分模型要求）"
          - generic [ref=f257e149]: "});"
        - paragraph [ref=f257e150]:
          - strong [ref=f257e151]: 适合
          - text: ：长对话里最近 N 轮最重要，旧的可以裁。
        - heading "模式 2：Delete Messages（删除）" [level=3] [ref=f257e152]
        - code [ref=f257e154]:
          - generic [ref=f257e155]: "import { RemoveMessage } from '@langchain/langgraph';"
          - generic [ref=f257e156]: "const newState = {"
          - generic [ref=f257e157]: "messages: messages"
          - generic [ref=f257e158]: .filter((m) => m.id !== 'msg_to_remove') // 永久删除某条
          - generic [ref=f257e159]: ".concat([new RemoveMessage({ id: 'msg_to_remove' })]),"
          - generic [ref=f257e160]: "};"
        - paragraph [ref=f257e161]:
          - strong [ref=f257e162]: 适合
          - text: ：明显不相关的消息（用户切换话题、测试输入）。
        - heading "模式 3：Summarize Messages（摘要）" [level=3] [ref=f257e163]
        - code [ref=f257e165]:
          - generic [ref=f257e166]: "import { SummarizationMiddleware } from 'langchain';"
          - generic [ref=f257e167]: "const summarizer = new SummarizationMiddleware({"
          - generic [ref=f257e168]: "model: openai('gpt-4o-mini'),"
          - generic [ref=f257e169]: "maxTokensBeforeSummary: 2000, // 超过 2000 token 触发"
          - generic [ref=f257e170]: "messagesToKeep: 10, // 保留最近 10 条"
          - generic [ref=f257e171]: "});"
          - generic [ref=f257e172]: // 自动把旧消息压成摘要塞进 context
        - paragraph [ref=f257e173]:
          - strong [ref=f257e174]: 适合
          - text: ：历史对话
          - strong [ref=f257e175]: 有价值
          - text: 但太占 token（电商客服、技术支持）。
        - heading "实战选型" [level=3] [ref=f257e176]
        - table [ref=f257e177]:
          - rowgroup [ref=f257e178]:
            - row "场景 推荐模式" [ref=f257e179]:
              - columnheader "场景" [ref=f257e180]
              - columnheader "推荐模式" [ref=f257e181]
          - rowgroup [ref=f257e182]:
            - row "短对话（< 20 轮） 直接全量塞，无需裁剪" [ref=f257e183]:
              - cell "短对话（< 20 轮）" [ref=f257e184]
              - cell "直接全量塞，无需裁剪" [ref=f257e185]:
                - text: 直接全量塞，
                - strong [ref=f257e186]: 无需裁剪
            - row "中等对话（20-50 轮） Trim last 策略" [ref=f257e187]:
              - cell "中等对话（20-50 轮）" [ref=f257e188]
              - cell "Trim last 策略" [ref=f257e189]
            - row "长对话（50+ 轮） Summarize 摘要" [ref=f257e190]:
              - cell "长对话（50+ 轮）" [ref=f257e191]
              - cell "Summarize 摘要" [ref=f257e192]
            - row "对话价值密度低 Delete 不相关消息" [ref=f257e193]:
              - cell "对话价值密度低" [ref=f257e194]
              - cell "Delete 不相关消息" [ref=f257e195]
        - heading "三、长期记忆的工程实现" [level=2] [ref=f257e196]
        - paragraph [ref=f257e197]:
          - text: 长期记忆的核心问题：
          - strong [ref=f257e198]: 什么时候存什么、什么时候取什么
          - text: 。
        - heading "方案 1：全量记录 + 全量检索" [level=3] [ref=f257e199]
        - code [ref=f257e201]:
          - generic [ref=f257e202]: // 存：每轮对话都存
          - generic [ref=f257e203]: "await longTermStore.add({"
          - generic [ref=f257e204]: "userId: 'u_123',"
          - generic [ref=f257e205]: "type: 'conversation',"
          - generic [ref=f257e206]: "content: '用户问了机票退改签政策',"
          - generic [ref=f257e207]: "timestamp: Date.now(),"
          - generic [ref=f257e208]: "});"
          - generic [ref=f257e209]: // 取：每次新会话，把全部历史塞进 prompt
          - generic [ref=f257e210]: const allMemories = await longTermStore.get('u_123');
          - generic [ref=f257e211]: "const prompt = `以下是用户历史对话：\\n${allMemories.map(m => m.content).join('\\n')}`;"
        - paragraph [ref=f257e212]:
          - strong [ref=f257e213]: 问题
          - text: ：1 年下来用户有 1000+ 条记录，
          - strong [ref=f257e214]: 全量塞 prompt 撑爆 context
          - text: 。
        - heading "方案 2：精选 + 向量检索" [level=3] [ref=f257e215]
        - code [ref=f257e217]:
          - generic [ref=f257e218]: // 取：只取与当前 query 相关的 top-K
          - generic [ref=f257e219]: "const relevantMemories = await longTermStore.search({"
          - generic [ref=f257e220]: "userId: 'u_123',"
          - generic [ref=f257e221]: "query: userQuery,"
          - generic [ref=f257e222]: "topK: 5,"
          - generic [ref=f257e223]: "});"
        - paragraph [ref=f257e224]:
          - strong [ref=f257e225]: 问题
          - text: ：哪些 memory 值得存？粒度怎么选？
        - heading "方案 3：自动提取 + 摘要 + 索引" [level=3] [ref=f257e226]
        - code [ref=f257e228]:
          - generic [ref=f257e229]: // 存：对话结束后，LLM 提取关键事实
          - generic [ref=f257e230]: "const facts = await extractFacts(conversation, {"
          - generic [ref=f257e231]: "model: openai('gpt-4o-mini'),"
          - generic [ref=f257e232]: "prompt: `从以下对话中提取用户相关的关键事实（偏好、决定、需求）："
          - generic [ref=f257e234]: "对话：${conversation}"
          - generic [ref=f257e236]: "输出 JSON: [{ \"type\": \"preference\" | \"fact\" | \"decision\", \"content\": \"...\" }]`,"
          - generic [ref=f257e237]: "});"
          - generic [ref=f257e238]: await longTermStore.bulkAdd(facts);
          - generic [ref=f257e239]: // 取：根据 query 检索 top-K 事实
          - generic [ref=f257e240]: "const relevant = await longTermStore.search({ query: userQuery, topK: 5 });"
        - paragraph [ref=f257e241]:
          - strong [ref=f257e242]: Mem0 就是这个思路
          - text: ——自动提取 + 索引 + 检索。
        - heading "四、Mem0：开源生产级 memory 架构" [level=2] [ref=f257e243]
        - paragraph [ref=f257e244]:
          - link "Mem0" [ref=f257e245]:
            - /url: https://arxiv.org/abs/2504.19413
          - text: （arXiv:2504.19413，2025）是一篇专门讲 LLM 长期记忆的论文 + 开源实现：
        - heading "核心架构" [level=3] [ref=f257e246]
        - figure "图 2：Mem0 架构" [ref=f257e248]:
          - document [ref=f257e250]:
            - generic [ref=f257e257]:
              - paragraph [ref=f257e264]: 对话
              - paragraph [ref=f257e271]:
                - text: Extractor
                - text: LLM 提取事实
              - paragraph [ref=f257e278]:
                - text: Storage
                - text: 向量库 + KV
              - paragraph [ref=f257e285]:
                - text: Retriever
                - text: query 时检索
              - paragraph [ref=f257e292]: LLM 推理
              - paragraph [ref=f257e299]:
                - text: Memory Update
                - text: 新增/更新/删除
          - generic [ref=f257e300]: 图 2：Mem0 架构
        - heading "关键性能数据（来自论文）" [level=3] [ref=f257e301]
        - paragraph [ref=f257e302]: 相比 OpenAI memory（基于全量对话）：
        - list [ref=f257e303]:
          - listitem [ref=f257e304]:
            - strong [ref=f257e305]: 26% LLM-as-Judge 提升
          - listitem [ref=f257e306]:
            - strong [ref=f257e307]: 91% p95 延迟降低
          - listitem [ref=f257e308]:
            - strong [ref=f257e309]: 90%+ token 成本节省
        - paragraph [ref=f257e310]:
          - text: 为什么？OpenAI 的方法是把全量对话塞 prompt（贵且慢），Mem0 用
          - strong [ref=f257e311]: 结构化提取 + 检索
          - text: （轻量且准）。
        - heading "Mem0 用法示例" [level=3] [ref=f257e312]
        - code [ref=f257e314]:
          - generic [ref=f257e315]: "import { Memory } from 'mem0ai';"
          - generic [ref=f257e316]: const memory = new Memory();
          - generic [ref=f257e317]: // 添加记忆
          - generic [ref=f257e318]: "await memory.add({"
          - generic [ref=f257e319]: "userId: 'u_123',"
          - generic [ref=f257e320]: "messages: ["
          - generic [ref=f257e321]: "{ role: 'user', content: '我叫张三，在上海工作' },"
          - generic [ref=f257e322]: "{ role: 'assistant', content: '好的，张三' },"
          - generic [ref=f257e323]: "],"
          - generic [ref=f257e324]: "});"
          - generic [ref=f257e325]: // 检索相关记忆
          - generic [ref=f257e326]: "const relevant = await memory.search({"
          - generic [ref=f257e327]: "userId: 'u_123',"
          - generic [ref=f257e328]: "query: '用户住在哪里？',"
          - generic [ref=f257e329]: "limit: 3,"
          - generic [ref=f257e330]: "});"
          - generic [ref=f257e331]: // → "用户叫张三，在上海工作"
        - heading "进阶：图记忆（Graph Memory）" [level=3] [ref=f257e332]
        - paragraph [ref=f257e333]:
          - text: Mem0 还有个变体叫
          - strong [ref=f257e334]: graph memory
          - text: ，把记忆之间的
          - strong [ref=f257e335]: 关系
          - text: 也存下来：
        - code [ref=f257e337]:
          - generic [ref=f257e338]: 张三 → 在 → 上海
          - generic [ref=f257e339]: 张三 → 工作于 → ACME 公司
          - generic [ref=f257e340]: ACME 公司 → 是 → 科技公司
        - paragraph [ref=f257e341]:
          - text: 查询”张三的公司在哪”时，
          - strong [ref=f257e342]: 沿着图遍历
          - text: 比纯向量检索更准。论文里图记忆比基础版本再涨 ~2%。
        - heading "五、生产陷阱" [level=2] [ref=f257e343]
        - heading "陷阱 1：存太多没用的”噪音”" [level=3] [ref=f257e344]
        - paragraph [ref=f257e345]:
          - text: 如果
          - strong [ref=f257e346]: 无差别地存所有对话
          - text: ，memory 库会膨胀成噪音仓库。每次检索 top-K 都可能召回无关内容。
        - paragraph [ref=f257e347]:
          - strong [ref=f257e348]: 修法
          - text: ：用 LLM 提取关键事实后再存，只存”用户相关的、有未来价值的”内容。
        - heading "陷阱 2：遗忘机制缺失" [level=3] [ref=f257e349]
        - paragraph [ref=f257e350]:
          - text: 用户 3 年前说”我喜欢蓝色”，今天审美变了。但 memory 里还有这条，
          - strong [ref=f257e351]: LLM 会继续按蓝色推荐
          - text: 。
        - paragraph [ref=f257e352]:
          - strong [ref=f257e353]: 修法
          - text: ：加”过期”机制——每条 memory 带
          - code [ref=f257e354]: created_at
          - text: +
          - code [ref=f257e355]: expires_at
          - text: ，定期清理。
        - heading "陷阱 3：跨用户隔离漏掉" [level=3] [ref=f257e356]
        - paragraph [ref=f257e357]:
          - text: 多租户场景下，memory 必须
          - strong [ref=f257e358]: 按 user 隔离
          - text: 。一个 bug 让用户 A 看到用户 B 的偏好，
          - strong [ref=f257e359]: 直接是安全事故
          - text: 。
        - code [ref=f257e361]:
          - generic [ref=f257e362]: // ❌ 危险
          - generic [ref=f257e363]: const memories = await store.get(userId);
          - generic [ref=f257e364]: // ✅ 安全：每次 query 带 userId
          - generic [ref=f257e365]: "const memories = await store.search({ userId, query, topK: 5 });"
        - heading "陷阱 4：Memory 检索污染 prompt" [level=3] [ref=f257e366]
        - paragraph [ref=f257e367]:
          - text: 如果 memory 检索返回的内容
          - strong [ref=f257e368]: 质量差
          - text: （“用户喜欢 X”），LLM 会照着错信息回答。
        - paragraph [ref=f257e369]:
          - strong [ref=f257e370]: 修法
          - text: ：在 prompt 里
          - strong [ref=f257e371]: 明确划界
          - text: ：
        - code [ref=f257e373]:
          - generic [ref=f257e374]: <user_memories>
          - generic [ref=f257e375]: "{memories.map(m => `<memory>${m.content}</memory>`).join('\\n')}"
          - generic [ref=f257e376]: </user_memories>
          - generic [ref=f257e377]: 注意：<user_memories> 内的内容**仅作参考**，不一定准确。
        - heading "六、生产方案对比" [level=2] [ref=f257e378]
        - table [ref=f257e379]:
          - rowgroup [ref=f257e380]:
            - row "方案 优势 劣势 适用" [ref=f257e381]:
