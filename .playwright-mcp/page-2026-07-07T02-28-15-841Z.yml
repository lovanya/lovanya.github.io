        - generic [ref=f219e31]: 返回列表
      - generic [ref=f219e33]:
        - heading "RAG 检索增强生成：从基础 RAG 到生产级架构" [level=1] [ref=f219e34]
        - time [ref=f219e36]: 发布于 2026年7月7日
      - generic [ref=f219e37]:
        - heading "前言" [level=2] [ref=f219e38]
        - paragraph [ref=f219e39]:
          - text: 如果你做过 LLM 应用，几乎肯定踩过这个坑：模型一本正经地编造事实，引用不存在的文档，给出过时的 API 答案。
          - strong [ref=f219e40]: 这些不是模型不够强，而是模型”没看过”你的数据。
        - paragraph [ref=f219e41]: RAG（Retrieval-Augmented Generation，检索增强生成）是工业界最主流的解决方案。它的核心思想很简单：
        - blockquote [ref=f219e42]:
          - paragraph [ref=f219e43]:
            - strong [ref=f219e44]: 不要让 LLM 凭记忆回答，先去查资料，再基于资料回答。
        - paragraph [ref=f219e45]: 但”基础 RAG” 和”生产级 RAG”之间隔着十万八千里。这一篇会按这条路线展开：
        - list [ref=f219e46]:
          - listitem [ref=f219e47]:
            - strong [ref=f219e48]: 基础 RAG
            - text: ：4 步 pipeline，理解最小可用闭环
          - listitem [ref=f219e49]:
            - strong [ref=f219e50]: 5 个让 RAG 失效的常见坑
          - listitem [ref=f219e51]:
            - strong [ref=f219e52]: Advanced RAG 5 大技法
            - text: ：query rewriting / hybrid search / reranking / chunking / metadata
          - listitem [ref=f219e53]:
            - strong [ref=f219e54]: 生产架构
            - text: ：从 Demo 到能扛 100 QPS 的工程化改造
        - heading "一、基础 RAG：4 步 pipeline" [level=2] [ref=f219e55]
        - paragraph [ref=f219e56]:
          - text: 2020 年 Facebook AI 的论文
          - link "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks" [ref=f219e57]:
            - /url: https://arxiv.org/abs/2005.11401
          - text: （Lewis et al.）正式命名了 RAG。LangChain 的
          - link "RAG tutorial" [ref=f219e58]:
            - /url: https://docs.langchain.com/oss/python/langchain/rag
          - text: 把这套范式落地成了 4 步标准 pipeline：
        - paragraph [ref=f219e59]: 每一步的作用：
        - list [ref=f219e60]:
          - listitem [ref=f219e61]:
            - strong [ref=f219e62]: Load
            - text: ：抓取文档（PDF / 网页 / 数据库 / Notion）成
            - code [ref=f219e63]: Document
            - text: 对象
          - listitem [ref=f219e64]:
            - strong [ref=f219e65]: Split
            - text: ：切成 500-1000 token 的 chunks，太长 LLM 读不完，太短语义断裂
          - listitem [ref=f219e66]:
            - strong [ref=f219e67]: Embed
            - text: ：每个 chunk 通过 embedding model 转成向量（768-3072 维）
          - listitem [ref=f219e68]:
            - strong [ref=f219e69]: Store
            - text: ：存入向量数据库，建立索引
        - paragraph [ref=f219e70]: 线上推理时，用户 query → embed → 相似度检索 → top-K chunks → 拼到 prompt → LLM 生成。
        - paragraph [ref=f219e71]:
          - strong [ref=f219e72]: 最小可运行的 TypeScript 代码
          - text: （用 Vercel AI SDK + pgvector）：
        - code [ref=f219e74]:
          - generic [ref=f219e75]: "import { embed, generateText } from 'ai';"
          - generic [ref=f219e76]: "import { openai } from '@ai-sdk/openai';"
          - generic [ref=f219e77]: "import { Pool } from 'pg';"
          - generic [ref=f219e78]: // 1. 检索
          - generic [ref=f219e79]: "const { embedding } = await embed({"
          - generic [ref=f219e80]: "model: openai.embedding('text-embedding-3-small'),"
          - generic [ref=f219e81]: "value: userQuery,"
          - generic [ref=f219e82]: "});"
          - generic [ref=f219e83]: "const pool = new Pool({ connectionString: process.env.DATABASE_URL });"
          - generic [ref=f219e84]: "const { rows } = await pool.query("
          - generic [ref=f219e85]: "`SELECT content FROM docs"
          - generic [ref=f219e86]: ORDER BY embedding <=> $1
          - generic [ref=f219e87]: "LIMIT 4`,"
          - generic [ref=f219e88]: "[JSON.stringify(embedding)]"
          - generic [ref=f219e89]: );
          - generic [ref=f219e90]: // 2. 拼 prompt
          - generic [ref=f219e91]: const context = rows.map((r) => r.content).join('\n\n---\n\n');
          - generic [ref=f219e92]: "const { text } = await generateText({"
          - generic [ref=f219e93]: "model: openai('gpt-4o'),"
          - generic [ref=f219e94]: "system: '只基于下面的资料回答问题，不要编造。',"
          - generic [ref=f219e95]: "prompt: `资料：\\n${context}\\n\\n问题：${userQuery}`,"
          - generic [ref=f219e96]: "});"
        - heading "二、5 个让基础 RAG 失效的坑" [level=2] [ref=f219e97]
        - paragraph [ref=f219e98]: 你以为 4 步搞定，结果上线后用户投诉”答非所问”。90% 是这 5 个坑：
        - heading "坑 1：chunk 切太大 / 太小" [level=3] [ref=f219e99]
        - list [ref=f219e100]:
          - listitem [ref=f219e101]:
            - strong [ref=f219e102]: 太大
            - text: ：一个 chunk 包含 5 个话题，检索时整段塞进 prompt，干扰答案
          - listitem [ref=f219e103]:
            - strong [ref=f219e104]: 太小
            - text: ：每个 chunk 语义不完整，LLM 拼不出上下文
        - paragraph [ref=f219e105]:
          - strong [ref=f219e106]: 经验值
          - text: ：500-1000 tokens 是 sweet spot，
          - strong [ref=f219e107]: overlap 100-200 tokens
          - text: 保证跨块语义连贯。
        - heading "坑 2：query 表述和文档用词不一致" [level=3] [ref=f219e108]
        - paragraph [ref=f219e109]:
          - text: 用户问”如何重置密码”，文档里写的是”修改 login credentials”。
          - strong [ref=f219e110]: 语义相同但用词不同
          - text: ，纯向量检索会失败。
        - paragraph [ref=f219e111]:
          - strong [ref=f219e112]: 修法
          - text: ：见下文技法 1（query rewriting）。
        - heading "坑 3：检索返回的 chunk 质量差" [level=3] [ref=f219e113]
        - paragraph [ref=f219e114]:
          - text: 向量相似度高 ≠ 答案相关。两个文档话题相似但
          - strong [ref=f219e115]: 方向相反
          - text: （“应该做 X” vs “不要做 X”），top-K 全召回反而误导 LLM。
        - paragraph [ref=f219e116]:
          - strong [ref=f219e117]: 修法
          - text: ：见下文技法 3（reranking）。
        - heading "坑 4：缺乏 metadata 过滤" [level=3] [ref=f219e118]
        - paragraph [ref=f219e119]: 100 万条 chunks 里，60% 是过期内容。LLM 拿到旧答案照答不误。
        - paragraph [ref=f219e120]:
          - strong [ref=f219e121]: 修法
          - text: ：建索引时给每条 chunk 加 metadata（
          - code [ref=f219e122]: created_at
          - text: ","
          - code [ref=f219e123]: category
          - text: ","
          - code [ref=f219e124]: source
          - text: ），检索时
          - strong [ref=f219e125]: 先 metadata 过滤再相似度排序
          - text: 。
        - heading "坑 5：直接返回 chunks，不格式化" [level=3] [ref=f219e126]
        - paragraph [ref=f219e127]:
          - text: LLM 拿到一堆原始文本块，不知道哪个是答案、哪个是上下文。需要 prompt engineering：
          - strong [ref=f219e128]: 用 XML 标签包裹 context，明确划界
          - text: ：
        - code [ref=f219e130]:
          - generic [ref=f219e131]: <context>
          - generic [ref=f219e132]: <doc id="1" source="api-docs.md">...</doc>
          - generic [ref=f219e133]: <doc id="2" source="faq.md">...</doc>
          - generic [ref=f219e134]: </context>
          - generic [ref=f219e135]: 请基于 <context> 中的资料回答下面的问题。
          - generic [ref=f219e136]: 如果资料不足，请明确说"我不知道"，不要编造。
          - generic [ref=f219e137]: "问题：{{user_query}}"
        - heading "三、Advanced RAG 5 大技法" [level=2] [ref=f219e138]
        - paragraph [ref=f219e139]: 基础 RAG 的召回率（recall）和精度（precision）都不够。Advanced RAG 通过 5 个技法系统性地提升质量：
        - heading "技法 1：Query Rewriting（查询改写）" [level=3] [ref=f219e140]
        - paragraph [ref=f219e141]: 把用户的口语化 query 改写成”文档风格”的正式 query，提升检索匹配率。
        - code [ref=f219e143]:
          - generic [ref=f219e144]: // 用 LLM 改写 query
          - generic [ref=f219e145]: "const { text: rewritten } = await generateText({"
          - generic [ref=f219e146]: "model: openai('gpt-4o-mini'),"
          - generic [ref=f219e147]: "prompt: `把用户问题改写为更适合文档检索的查询，保留核心意图但用词更规范。"
          - generic [ref=f219e148]: "用户问题：${userQuery}"
          - generic [ref=f219e149]: "改写后的查询：`,"
          - generic [ref=f219e150]: "});"
          - generic [ref=f219e151]: // 再用改写后的 query 做向量检索
        - paragraph [ref=f219e152]:
          - strong [ref=f219e153]: 进阶
          - text: ：HyDE（Hypothetical Document Embeddings）让 LLM 先生成”假设答案”，再用假设答案的 embedding 去检索。
          - strong [ref=f219e154]: 对长尾 query 效果显著
          - text: 。
        - heading "技法 2：Hybrid Search（混合检索）" [level=3] [ref=f219e155]
        - paragraph [ref=f219e156]:
          - text: 向量检索擅长语义，但
          - strong [ref=f219e157]: 对精确关键词、专有名词、型号代码很弱
          - text: 。混合检索把向量检索 + 关键词检索（BM25）融合：
        - code [ref=f219e159]:
          - generic [ref=f219e160]: // 1. 向量检索 top 20
          - generic [ref=f219e161]: const vectorResults = await vectorSearch(queryEmbedding, 20);
          - generic [ref=f219e162]: // 2. BM25 关键词检索 top 20
          - generic [ref=f219e163]: const bm25Results = await bm25Search(query, 20);
          - generic [ref=f219e164]: // 3. Reciprocal Rank Fusion 合并
          - generic [ref=f219e165]: const combined = rrfMerge(vectorResults, bm25Results);
          - generic [ref=f219e166]: // → 取 top K 送 LLM
        - paragraph [ref=f219e167]:
          - link "Pinecone 文档" [ref=f219e168]:
            - /url: https://docs.pinecone.io/guides/get-started/overview
          - text: 把 hybrid search 列为生产 RAG 的推荐配置。
          - strong [ref=f219e169]: 纯向量检索在精度要求高的场景会出问题
          - text: （比如搜索特定 API 名称、错误码）。
        - heading "技法 3：Reranking（重排序）" [level=3] [ref=f219e170]
        - paragraph [ref=f219e171]: 先用便宜的方式（向量 / BM25）召回 top 50-100，再用贵的 cross-encoder 模型精排 top 5-10。
        - code [ref=f219e173]:
          - generic [ref=f219e174]: "import { cohere } from '@ai-sdk/cohere';"
          - generic [ref=f219e175]: // 1. 粗排：向量检索 top 50
          - generic [ref=f219e176]: const candidates = await vectorSearch(queryEmbedding, 50);
          - generic [ref=f219e177]: // 2. 精排：Cross-encoder reranker
          - generic [ref=f219e178]: "const reranked = await cohere.rerank({"
          - generic [ref=f219e179]: "model: 'rerank-english-v3.0',"
          - generic [ref=f219e180]: "query: userQuery,"
          - generic [ref=f219e181]: "documents: candidates.map((c) => c.text),"
          - generic [ref=f219e182]: "topK: 5,"
          - generic [ref=f219e183]: "});"
        - paragraph [ref=f219e184]:
          - text: Reranker 把”召回的相关”重新排序成”真正有用的”，
          - strong [ref=f219e185]: 通常把端到端准确率提升 15-30%
          - text: 。
        - heading "技法 4：Better Chunking" [level=3] [ref=f219e186]
        - paragraph [ref=f219e187]:
          - text: 基础的
          - code [ref=f219e188]: RecursiveCharacterTextSplitter
          - text: 对所有文档一刀切。但
          - strong [ref=f219e189]: 不同类型文档的最优切法不同
          - text: ：
        - table [ref=f219e190]:
          - rowgroup [ref=f219e191]:
            - row "文档类型 推荐策略" [ref=f219e192]:
              - columnheader "文档类型" [ref=f219e193]
              - columnheader "推荐策略" [ref=f219e194]
          - rowgroup [ref=f219e195]:
            - 'row "Markdown / 结构化文本 按 header 切（# ##），保留完整章节" [ref=f219e196]':
              - cell "Markdown / 结构化文本" [ref=f219e197]
              - 'cell "按 header 切（# ##），保留完整章节" [ref=f219e198]':
                - text: 按 header 切（
                - code [ref=f219e199]: "#"
                - code [ref=f219e200]: "##"
                - text: ），保留完整章节
            - row "代码 按函数 / 类切，保留上下文注释" [ref=f219e201]:
              - cell "代码" [ref=f219e202]
              - cell "按函数 / 类切，保留上下文注释" [ref=f219e203]
            - row "表格 整表 + 表格描述（“这是 2025 年各产品定价”）" [ref=f219e204]:
              - cell "表格" [ref=f219e205]
              - cell "整表 + 表格描述（“这是 2025 年各产品定价”）" [ref=f219e206]
            - row "长文档 滑动窗口 + 摘要预 chunk" [ref=f219e207]:
              - cell "长文档" [ref=f219e208]
              - cell "滑动窗口 + 摘要预 chunk" [ref=f219e209]
        - paragraph [ref=f219e210]:
          - strong [ref=f219e211]: 生产经验
          - text: ：chunk 大小、overlap、是否带 header——这三个参数
          - strong [ref=f219e212]: 每个数据集都要重新调
          - text: ，没有银弹。
        - heading "技法 5：Metadata Filtering" [level=3] [ref=f219e213]
        - paragraph [ref=f219e214]: 检索时先按 metadata 缩小范围，再做相似度排序：
        - code [ref=f219e216]:
          - generic [ref=f219e217]: "const { rows } = await pool.query("
          - generic [ref=f219e218]: "`SELECT content FROM docs"
          - generic [ref=f219e219]: WHERE created_at > $2 -- 只看最近 1 年的文档
          - generic [ref=f219e220]: AND category = $3 -- 只看 API 类文档
          - generic [ref=f219e221]: ORDER BY embedding <=> $1
          - generic [ref=f219e222]: "LIMIT 4`,"
          - generic [ref=f219e223]: "[JSON.stringify(embedding), '2025-01-01', 'api-docs']"
          - generic [ref=f219e224]: );
        - paragraph [ref=f219e225]:
          - strong [ref=f219e226]: 这一步比技法 1-4 都重要
          - text: ——用户大半问题可以通过 metadata 直接锁定答案域，向量检索只是补充。
        - heading "四、生产架构：从 Demo 到 100 QPS" [level=2] [ref=f219e227]
        - paragraph [ref=f219e228]: Demo 跑通后，工程化要解决 5 个问题：
        - heading "问题 1：冷启动延迟" [level=3] [ref=f219e229]
        - paragraph [ref=f219e230]:
          - text: 每次 query 都要先 embed（50ms）+ 检索（50ms）+ LLM 生成（1-3s）。
          - strong [ref=f219e231]: 优化
          - text: ：
        - list [ref=f219e232]:
          - listitem [ref=f219e233]:
            - strong [ref=f219e234]: Embedding 缓存
            - text: ：query embedding 缓存（命中率 30%+ 因为很多 query 重复）
          - listitem [ref=f219e235]:
            - strong [ref=f219e236]: Prompt cache
            - text: ：OpenAI / Anthropic 对重复 prefix 自动 cache，节省 90% 成本 + 延迟
          - listitem [ref=f219e237]:
            - strong [ref=f219e238]: Pre-warm
            - text: ：高频 query 提前算好 embedding
        - heading "问题 2：检索质量监控" [level=3] [ref=f219e239]
        - paragraph [ref=f219e240]:
          - text: 生产里你不知道
          - strong [ref=f219e241]: 检索到底返回了什么、LLM 到底用了什么
          - text: 。需要：
        - list [ref=f219e242]:
          - listitem [ref=f219e243]:
            - strong [ref=f219e244]: Trace 系统
            - text: ：LangSmith / Langfuse / OpenLLMetry，每次 query 全链路记录
          - listitem [ref=f219e245]:
            - strong [ref=f219e246]: 离线评估集
            - text: ：100-200 条标注 query，定期跑回归
          - listitem [ref=f219e247]:
            - strong [ref=f219e248]: 在线指标
            - text: ：用户反馈、答案引用命中率
        - heading "问题 3：增量更新" [level=3] [ref=f219e249]
        - paragraph [ref=f219e250]:
          - text: 新文档每天进来，需要
          - strong [ref=f219e251]: 不停机更新向量索引
          - text: ：
        - code [ref=f219e253]:
          - generic [ref=f219e254]: // 入库：先写 OLTP DB，再异步写向量 DB
          - generic [ref=f219e255]: "await db.insert({ content, embedding: null, ... });"
          - generic [ref=f219e256]: "queue.push({ type: 'embed', docId }); // 后台 worker 处理"
          - generic [ref=f219e257]: // Worker：embed 后写入向量 DB
          - generic [ref=f219e258]: "const { embedding } = await embed({ model, value: content });"
          - generic [ref=f219e259]: "await vectorDB.upsert({ id: docId, embedding, content });"
        - heading "问题 4：多租户隔离" [level=3] [ref=f219e260]
        - paragraph [ref=f219e261]: 不同客户数据不能混在一起。两种做法：
        - list [ref=f219e262]:
          - listitem [ref=f219e263]:
            - strong [ref=f219e264]: 物理隔离
            - text: ：每个租户一个向量 index
          - listitem [ref=f219e265]:
            - strong [ref=f219e266]: 逻辑隔离
            - text: ：共享 index，但每条记录带
            - code [ref=f219e267]: tenant_id
            - text: metadata，检索时强制
            - code [ref=f219e268]: WHERE tenant_id = ?
        - heading "问题 5：成本控制" [level=3] [ref=f219e269]
        - paragraph [ref=f219e270]: 100 QPS × 1000 tokens × 1M Q/月 = 100B tokens/月。
        - list [ref=f219e271]:
          - listitem [ref=f219e272]:
            - strong [ref=f219e273]: Tier 1
            - text: ：高频 query 用小模型（gpt-4o-mini / Claude Haiku）+ 向量检索
          - listitem [ref=f219e274]:
            - strong [ref=f219e275]: Tier 2
            - text: ：复杂 query 路由到 GPT-4o / Opus
          - listitem [ref=f219e276]:
            - strong [ref=f219e277]: Tier 3
            - text: ：纯闲聊走 LLM 不走 RAG
        - heading "踩坑提醒" [level=2] [ref=f219e278]
        - list [ref=f219e279]:
          - listitem [ref=f219e280]:
            - strong [ref=f219e281]: 不要把整个向量库塞进 context
            - text: 。一个 query 召回 20-50 个 chunks 是常见错误。
            - strong [ref=f219e282]: top-K 在 3-8 之间最佳
            - text: ，更多反而干扰。
          - listitem [ref=f219e283]:
            - strong [ref=f219e284]: 不要用 base embedding 算 retrieval 准确率
            - text: 。换 chat model 之前，
            - strong [ref=f219e285]: embedding model 必须先评估
            - text: （下一帖会展开）。
          - listitem [ref=f219e286]:
            - strong [ref=f219e287]: 不要忽略 chunk 的来源标注
            - text: 。每条 retrieved chunk 都要带
            - code [ref=f219e288]: doc_id
            - text: /
            - code [ref=f219e289]: source_url
            - text: ，LLM 输出时引用来源，用户能验证答案。
          - listitem [ref=f219e290]:
            - strong [ref=f219e291]: 不要假设 BM25 已死
            - text: 。Hybrid search 在生产里几乎 always 优于纯向量，
            - strong [ref=f219e292]: 特别是含专有名词的领域
            - text: （法律 / 医疗 / API 文档）。
          - listitem [ref=f219e293]:
            - strong [ref=f219e294]: 不要把 embedding model 锁死在一家
            - text: 。Cohere / OpenAI / Voyage / BGE 各有强项，按场景选型。
        - heading "总结" [level=2] [ref=f219e295]
        - paragraph [ref=f219e296]: 5 个 takeaway：
        - list [ref=f219e297]:
          - listitem [ref=f219e298]:
            - strong [ref=f219e299]: 基础 RAG
            - text: ：4 步 pipeline（Load → Split → Embed → Store），最小可用但召回 / 精度都不够。
          - listitem [ref=f219e300]:
            - strong [ref=f219e301]: 5 个常见坑
            - text: ：chunk 切错、query 表述不一致、检索质量差、缺 metadata、prompt 不格式化——90% 的失败源自这 5 个。
          - listitem [ref=f219e302]:
            - strong [ref=f219e303]: Advanced RAG 5 技法
            - text: ：query rewriting / hybrid search / reranking / better chunking / metadata filtering，
            - strong [ref=f219e304]: 优先级：metadata > reranking > hybrid > chunking > query rewriting
            - text: 。
          - listitem [ref=f219e305]:
            - strong [ref=f219e306]: 生产架构
            - text: ：解决延迟（缓存）、质量（trace + eval）、更新（异步 pipeline）、隔离（metadata）、成本（分 tier）。
          - listitem [ref=f219e307]:
            - strong [ref=f219e308]: 别忽略 embedding model
            - text: ：下一篇会专门讲怎么选。
        - paragraph [ref=f219e309]:
          - strong [ref=f219e310]: 下一篇
          - text: ：
