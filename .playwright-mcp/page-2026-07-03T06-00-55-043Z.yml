        - generic [ref=f30e25]: 返回列表
      - generic [ref=f30e27]:
        - heading "大模型入门：Transformer 与 LLM 是怎么工作的" [level=1] [ref=f30e28]
        - time [ref=f30e30]: 发布于 2026年7月3日
      - generic [ref=f30e31]:
        - heading "前言" [level=2] [ref=f30e32]
        - paragraph [ref=f30e33]:
          - text: 做前端架构的人要不要懂 Transformer？我的回答是
          - strong [ref=f30e34]: 要
          - text: ——不是去推导公式，而是要建立”模型在做什么”的直觉。原因有三：
        - list [ref=f30e35]:
          - listitem [ref=f30e36]:
            - strong [ref=f30e37]: 你写的 prompt 不是黑盒
            - text: ：理解 tokenization、context window、attention，你才能解释为什么”请逐步思考”有效、为什么超长 prompt 后半段容易被忽略。
          - listitem [ref=f30e38]:
            - strong [ref=f30e39]: 生产排错需要它
            - text: ：当 streaming 截断、温度参数没生效、function call 返回畸形 JSON 时，懂底层的人能 5 分钟定位，不懂的人只能瞎试。
          - listitem [ref=f30e40]:
            - strong [ref=f30e41]: 技术选型不被忽悠
            - text: ：闭源 vs 开源、7B vs 70B、encoder-only vs decoder-only，这些选择都有明确的工程权衡，依赖直觉很容易选错。
        - paragraph [ref=f30e42]: 这一篇是系列开篇。我会跳过数学推导，用架构图 + 简短 TS 代码 + 真实论文引用，把 Transformer / LLM 的工作原理讲清楚。下一篇会聊 Token、Context Window 和 Prompt Engineering 的核心模式。
        - heading "一、Transformer：LLM 的心脏" [level=2] [ref=f30e43]
        - paragraph [ref=f30e44]:
          - text: LLM 的”骨架”是
          - strong [ref=f30e45]: Transformer 架构
          - text: ，由 Vaswani 等人在 2017 年提出，原论文标题就叫
          - emphasis [ref=f30e46]: Attention Is All You Need
          - text: （
          - link "arXiv:1706.03762" [ref=f30e47]:
            - /url: https://arxiv.org/abs/1706.03762
          - text: ）。在它之前，NLP 主流是 RNN/LSTM，按时间步串行处理。Transformer 改用了一种叫
          - strong [ref=f30e48]: self-attention
          - text: 的机制，让序列里
          - strong [ref=f30e49]: 任意两个位置可以直接对话
          - text: ，并行训练效率大幅提升。
        - paragraph [ref=f30e50]: 一个 Transformer block 的核心流程（decoder-only，用于 LLM）：
        - figure "图 1：Transformer decoder block 的数据流" [ref=f30e52]:
          - document [ref=f30e54]:
            - generic [ref=f30e57]:
              - paragraph [ref=f30e64]: Input Tokens
              - paragraph [ref=f30e71]: Token + Positional Embedding
              - paragraph [ref=f30e78]: Masked Self-Attention
              - paragraph [ref=f30e85]: Add & Norm
              - paragraph [ref=f30e92]: Feed-Forward
              - paragraph [ref=f30e99]: Add & Norm
              - paragraph [ref=f30e106]: Output Logits
              - paragraph [ref=f30e113]: Softmax → Next Token
          - generic [ref=f30e114]: 图 1：Transformer decoder block 的数据流
        - paragraph [ref=f30e115]: 作为架构师，你只需要记住三件事：
        - list [ref=f30e116]:
          - listitem [ref=f30e117]:
            - strong [ref=f30e118]: Self-Attention
            - text: ：让每个 token 都能”看到”前文所有 token，并学到一个加权汇总。这正是 LLM 能理解长距离依赖的关键。
          - listitem [ref=f30e119]:
            - strong [ref=f30e120]: Feed-Forward (FFN)
            - text: ：attention 之后接一个全连接层，做”知识检索”——大量事实性知识就存在 FFN 的参数里。
          - listitem [ref=f30e121]:
            - strong [ref=f30e122]: 残差 + LayerNorm
            - text: ：让上百层网络还能稳定训练，没有这些 trick，深度根本堆不上去。
        - paragraph [ref=f30e123]:
          - text: 后来的 LLaMA 论文（
          - link "arXiv:2302.13971" [ref=f30e124]:
            - /url: https://arxiv.org/abs/2302.13971
          - text: ）、Qwen、DeepSeek 等等，
          - strong [ref=f30e125]: 结构都没跳出这个框架
          - text: ，主要差异在训练数据、规模和一些 trick（RoPE 位置编码、SwiGLU 激活、Grouped Query Attention 等）。所以理解 Transformer 之后，所有”新模型”对你都不再是黑盒。
        - heading "二、LLM 是怎么”学会说话”的：训练三阶段" [level=2] [ref=f30e126]
        - paragraph [ref=f30e127]:
          - text: 一个 chat 模型从无到有，
          - strong [ref=f30e128]: 至少
          - text: 经历三个阶段（论文
          - emphasis [ref=f30e129]: Training language models to follow instructions
          - text: / InstructGPT 详细描述了这个流程）：
        - figure "图 2：LLM 训练三阶段 pipeline" [ref=f30e131]:
          - generic [ref=f30e132]:
            - paragraph [ref=f30e133]: Mermaid render error — showing source
            - code [ref=f30e135]: "flowchart LR P[海量原始文本<br/>TB 级] --> PT[阶段 1<br/>Pretrain<br/>Next-token Prediction] PT --> SFT[阶段 2<br/>SFT<br/>指令微调] SFT --> RLHF[阶段 3<br/>RLHF / DPO<br/>对齐人类偏好] RLHF --> C[Chat Model]}"
            - paragraph [ref=f30e136]: "Lexical error on line 5. Unrecognized text. ...HF --> C[Chat Model]} -----------------------^"
          - generic [ref=f30e137]: 图 2：LLM 训练三阶段 pipeline
        - heading "阶段 1：预训练（Pretrain）" [level=3] [ref=f30e138]
        - paragraph [ref=f30e139]:
          - text: 模型在几 TB 的网页、书籍、代码上做
          - strong [ref=f30e140]: 自监督学习
          - text: ：给定前 N 个 token，预测第 N+1 个。这阶段耗资最大（GPT-4 级别模型据说花费数千万到上亿美元），产生的是
          - strong [ref=f30e141]: base model
          - text: （能续写，但不会问答）。
        - heading "阶段 2：监督微调（SFT）" [level=3] [ref=f30e142]
        - paragraph [ref=f30e143]: 用人工编写的”指令—回答”对（数万到数十万条）继续训练。模型从”续写机器”变成”听话的助手”。这一步成本骤降，通常几卡天就能跑完。
        - heading "阶段 3：偏好对齐（RLHF / DPO）" [level=3] [ref=f30e144]
        - paragraph [ref=f30e145]:
          - text: 让人类对多个回答排序，用强化学习（RLHF，如 PPO）或直接偏好优化（DPO）把模型”调教”得更安全、更有用、更符合品牌语气。Anthropic 的
          - emphasis [ref=f30e146]: Constitutional AI
          - text: 、OpenAI 的
          - emphasis [ref=f30e147]: InstructGPT
          - text: 都属于这一脉。
        - paragraph [ref=f30e148]:
          - strong [ref=f30e149]: 踩坑提醒
          - text: ：你在 Hugging Face 上看到一个
          - code [ref=f30e150]: Base
          - text: 模型（如
          - code [ref=f30e151]: Qwen2.5-7B
          - text: ），和一个
          - code [ref=f30e152]: Instruct
          - text: /
          - code [ref=f30e153]: Chat
          - text: 模型（如
          - code [ref=f30e154]: Qwen2.5-7B-Instruct
          - text: ），
          - strong [ref=f30e155]: 它们的训练阶段不同
          - text: 。Base 模型适合做续写、分类、embedding 微调；Instruct 模型才能直接拿来做 chat。
          - strong [ref=f30e156]: 生产里几乎永远选 Instruct 版本
          - text: ，除非你有专门的微调计划。
        - heading "三、推理时发生了什么" [level=2] [ref=f30e157]
        - paragraph [ref=f30e158]:
          - text: 训练完，模型进入
          - strong [ref=f30e159]: 推理
          - text: （inference / serving）阶段。前端架构师真正打交道的是这一层。
        - heading "3.1 Token-by-Token 生成" [level=3] [ref=f30e160]
        - paragraph [ref=f30e161]:
          - text: LLM 一次生成
          - strong [ref=f30e162]: 一个 token
          - text: （中文大约 1.5 个汉字），然后把它拼回 prompt 末尾，再生成下一个。这就是为什么我们看到的输出是**流式（streaming）**的——前端用 SSE / WebSocket 接收每个 chunk。
        - code [ref=f30e164]:
          - generic [ref=f30e165]: // Vercel AI SDK — 流式生成（生产代码片段）
          - generic [ref=f30e166]: "import { streamText } from 'ai';"
          - generic [ref=f30e167]: "import { openai } from '@ai-sdk/openai';"
          - generic [ref=f30e168]: "const result = streamText({"
          - generic [ref=f30e169]: "model: openai('gpt-4o'),"
          - generic [ref=f30e170]: "prompt: '用一句话解释 Transformer 的 self-attention',"
          - generic [ref=f30e171]: "});"
          - generic [ref=f30e172]: "for await (const chunk of result.textStream) {"
          - generic [ref=f30e173]: process.stdout.write(chunk);
          - generic [ref=f30e174]: "}"
        - heading "3.2 采样策略：为什么同一个 prompt 多次调用结果不同" [level=3] [ref=f30e175]
        - paragraph [ref=f30e176]:
          - text: 模型每一步输出的是一个
          - strong [ref=f30e177]: 概率分布
          - text: （vocabulary size ≈ 50K-100K）。我们要从这个分布里挑一个 token：
        - list [ref=f30e178]:
          - listitem [ref=f30e179]:
            - strong [ref=f30e180]: Greedy
            - text: ：永远选概率最大的。确定性强，但容易重复、枯燥。
          - listitem [ref=f30e181]:
            - strong [ref=f30e182]: Temperature
            - text: ：高温（T > 1）拉平分布，结果更”发散”；低温（T < 1）拉尖分布，更”聚焦”。
          - listitem [ref=f30e183]:
            - strong [ref=f30e184]: Top-p / Top-k
            - text: ：只从概率最高的 k 个或累计概率到 p 的 token 里采样，过滤掉明显不合理的尾巴。
        - paragraph [ref=f30e185]:
          - text: Hugging Face 的
          - link "LLM tutorial" [ref=f30e186]:
            - /url: https://huggingface.co/docs/transformers/llm_tutorial
          - text: 给了一个完整例子：
          - code [ref=f30e187]: do_sample=True
          - text: +
          - code [ref=f30e188]: temperature=0.7
          - text: 是 chat 场景的常用起点。
        - heading "3.3 KV Cache：为什么长 prompt 慢" [level=3] [ref=f30e189]
        - paragraph [ref=f30e190]:
          - text: 每生成一个 token，模型都要重新跑一遍 self-attention。
          - strong [ref=f30e191]: 优化手段
          - text: 是把之前每个 token 的 Key / Value 向量缓存下来，下次只用算新 token——这就是
          - strong [ref=f30e192]: KV cache
          - text: 。
        - paragraph [ref=f30e193]:
          - text: 代价：KV cache 占用显存大致和
          - code [ref=f30e194]: batch × seq_len × hidden_dim
          - text: 成正比。
          - strong [ref=f30e195]: Context window 越长，显存占用越大
          - text: 。这就是为什么 200K context 的模型要么贵、要么需要量化（PagedAttention、FlashAttention 等技术缓解，但不会消除）。
        - heading "四、Scaling Laws：模型为什么”越大越聪明”" [level=2] [ref=f30e196]
        - paragraph [ref=f30e197]:
          - text: 业界有一个被反复验证的经验规律（
          - emphasis [ref=f30e198]: Scaling Laws for Neural Language Models
          - text: ，Kaplan et al. 2020）：
          - strong [ref=f30e199]: 模型参数量 N、训练数据量 D、计算量 C 三者按幂律关系同步扩大时，loss 会平滑下降
          - text: 。
        - paragraph [ref=f30e200]:
          - text: 但这只是”平均能力”在涨。真正让人惊艳的是
          - strong [ref=f30e201]: 涌现（emergent abilities）
          - text: ：在某些任务（多步推理、代码生成）上，模型小到某个阈值之前几乎是 0 分，超过阈值后突然大幅跃升。这不是玄学，而是 scaling 让模型首次”看到足够多类似样本”后学会了某种通用解法。
        - paragraph [ref=f30e202]:
          - strong [ref=f30e203]: Chinchilla
          - text: （Hoffmann et al. 2022，DeepMind）进一步指出：
          - strong [ref=f30e204]: 对于给定算力，模型大小和数据量要按比例增长才最优
          - text: 。这就是为什么后来大家都在”卷训练 tokens”——Llama 3 把训练数据推到 15T tokens。
        - paragraph [ref=f30e205]:
          - strong [ref=f30e206]: 避坑提醒
          - text: ：当一个供应商宣传”我们用 1B 模型 + 领域数据微调，效果超过 GPT-4”时——大概率是在某个特定窄任务上做了过拟合。在通用 chat / 推理 / 复杂规划上，
          - strong [ref=f30e207]: 模型规模仍是主导因素
          - text: 。这不意味着大模型永远赢，但选型时要有清醒的预期。
        - heading "踩坑提醒（资深架构师请重点看）" [level=2] [ref=f30e208]
        - list [ref=f30e209]:
          - listitem [ref=f30e210]:
            - strong [ref=f30e211]: 不要把 base model 当 chat model 用
            - text: 。
            - code [ref=f30e212]: Llama-3-70B
            - text: （base）和
            - code [ref=f30e213]: Llama-3-70B-Instruct
            - text: 差别巨大，后者才有对话能力。
          - listitem [ref=f30e214]:
            - strong [ref=f30e215]: 不要忽视 tokenization 边界
            - text: 。中文 1 个汉字通常不是 1 个 token，而是 1-2 个。
            - code [ref=f30e216]: "\"你好\""
            - text: 在 Qwen tokenizer 下可能是 2-3 个 token。
            - strong [ref=f30e217]: 算成本时永远用 tokenizer 实际计数，不要按字符估算
            - text: 。
          - listitem [ref=f30e218]:
            - strong [ref=f30e219]: Streaming 截断 ≠ 错误
            - text: 。前端处理
            - code [ref=f30e220]: "data: [DONE]"
            - text: 信号时，记得做
            - code [ref=f30e221]: try/finally
            - text: 关闭流，否则半截响应会卡住连接。
          - listitem [ref=f30e222]:
            - strong [ref=f30e223]: 不要在 prompt 里塞 JSON Schema 让模型自己”格式化”
            - text: 。用工具调用（tool use / function calling）让模型
            - strong [ref=f30e224]: 结构化输出
            - text: ，比 prompt 工程靠谱得多。下一篇和后续会详细讲。
          - listitem [ref=f30e225]:
            - strong [ref=f30e226]: Context 越长 ≠ 越好
            - text: 。长 context 容易出现 “Lost in the Middle” 现象（Liu et al. 2023）——模型对中段内容的注意力会显著下降。重要信息放 prompt 开头或结尾。
        - heading "总结" [level=2] [ref=f30e227]
        - paragraph [ref=f30e228]: 这一篇用 5 个关键事实把 LLM 底层串起来：
        - list [ref=f30e229]:
          - listitem [ref=f30e230]:
            - strong [ref=f30e231]: Transformer
            - text: 用 self-attention 让任意两个 token 直接通信，是 LLM 的结构基石（Vaswani et al. 2017）。
          - listitem [ref=f30e232]:
            - strong [ref=f30e233]: 训练三阶段
            - text: ：Pretrain → SFT → RLHF/DPO，缺一不可。
          - listitem [ref=f30e234]:
            - strong [ref=f30e235]: 推理
            - text: 是 token-by-token 的概率采样；KV cache 让长 context 可行但吃显存。
          - listitem [ref=f30e236]:
            - strong [ref=f30e237]: Scaling Laws
            - text: 解释了”为什么大就是好”；涌现能力让 scaling 物有所值。
          - listitem [ref=f30e238]:
            - strong [ref=f30e239]: 生产里
            - text: ：选 Instruct 模型、用 tokenizer 算成本、流式 + 工具调用优于 prompt hack。
        - paragraph [ref=f30e240]:
          - strong [ref=f30e241]: 下一篇
          - text: ：
          - link "Token、Context Window 与 Prompt Engineering 核心模式" [ref=f30e242]:
            - /url: /blog/tokens-context-and-prompts
          - text: — 把今天的底层知识落地为 prompt 设计技法。
        - heading "参考资料" [level=2] [ref=f30e243]
        - list [ref=f30e244]:
          - listitem [ref=f30e245]:
            - link "Attention Is All You Need (Vaswani et al., 2017)" [ref=f30e246]:
              - /url: https://arxiv.org/abs/1706.03762
            - text: — Transformer 原始论文，所有现代 LLM 的结构起源
          - listitem [ref=f30e247]:
            - link "Language Models are Few-Shot Learners (Brown et al., 2020)" [ref=f30e248]:
              - /url: https://arxiv.org/abs/2005.14165
            - text: — GPT-3 论文，175B 参数的 in-context learning 实验
          - listitem [ref=f30e249]:
            - 'link "LLaMA: Open and Efficient Foundation Language Models (Touvron et al., 2023)" [ref=f30e250]':
              - /url: https://arxiv.org/abs/2302.13971
            - text: — 开源 LLaMA 系列的初代论文
          - listitem [ref=f30e251]:
            - link "Hugging Face Transformers — LLM Tutorial" [ref=f30e252]:
              - /url: https://huggingface.co/docs/transformers/llm_tutorial
            - text: — 官方文档：
            - code [ref=f30e253]: generate()
            - text: 、采样策略、padding side 等工程细节
          - listitem [ref=f30e254]:
