        - heading "方案 B：中等规模，500 万 - 5000 万文档" [level=3] [ref=f231e490]
        - code [ref=f231e492]:
          - generic [ref=f231e493]: "// embedding: bge-m3 自托管（GPU）"
          - generic [ref=f231e494]: "// vector DB: Milvus Standalone + BM25 混合检索"
          - generic [ref=f231e495]: // 1 台 8 卡 GPU 服务器 + 1 台向量库主机
        - paragraph [ref=f231e496]:
          - strong [ref=f231e497]: 月度成本
          - text: ：GPU 服务器 ~$3000 + 向量库主机 ~$500
        - heading "方案 C：大规模，亿级文档" [level=3] [ref=f231e498]
        - code [ref=f231e500]:
          - generic [ref=f231e501]: "// embedding: 混合（自托管 bge-m3 + 调用 OpenAI 大模型）"
          - generic [ref=f231e502]: "// vector DB: Milvus Distributed + Cohere Rerank"
          - generic [ref=f231e503]: // 多台 GPU + K8s 集群
        - paragraph [ref=f231e504]:
          - strong [ref=f231e505]: 月度成本
          - text: ：GPU 集群 ~$15000 + Cohere rerank（按调用）
        - heading "踩坑提醒" [level=2] [ref=f231e506]
        - list [ref=f231e507]:
          - listitem [ref=f231e508]:
            - strong [ref=f231e509]: 不要混用不同 embedding 模型的向量
            - text: 。如果迁移模型，
            - strong [ref=f231e510]: 必须全量重新 embed
            - text: ，不能新旧混用（向量空间不同）。
          - listitem [ref=f231e511]:
            - strong [ref=f231e512]: 不要只看 benchmark 排名选 embedding
            - text: 。
            - strong [ref=f231e513]: 用自己的领域数据 + 真实 query 做离线评测
            - text: ，否则英文 SOTA 在中文 / 法律 / 代码领域可能翻车。
          - listitem [ref=f231e514]:
            - strong [ref=f231e515]: 不要忽视 metadata 过滤的索引
            - text: 。pgvector 的 metadata 过滤如果没有合适索引，亿级数据下会全表扫描。
          - listitem [ref=f231e516]:
            - strong [ref=f231e517]: 不要把向量索引和数据混在同一台机器上
            - text: 。生产推荐向量库独立部署 + 副本，避免 OLTP 写入影响检索性能。
          - listitem [ref=f231e518]:
            - strong [ref=f231e519]: 不要”一次选型永远不变”
            - text: 。每 6 个月 re-eval 一次 embedding / 向量库，
            - strong [ref=f231e520]: 新模型 / 新库可能比当前更好
            - text: 。
        - heading "总结" [level=2] [ref=f231e521]
        - paragraph [ref=f231e522]: 5 个 takeaway：
        - list [ref=f231e523]:
          - listitem [ref=f231e524]:
            - strong [ref=f231e525]: Embedding 模型决定 RAG 上限
            - text: ：5 维度评估（准确率 / 多语种 / 维度 / 成本 / 上下文），首选在自己数据上做离线 A/B。
          - listitem [ref=f231e526]:
            - strong [ref=f231e527]: BGE-m3 是中文 / 多语种首选
            - text: ：开源可自托管，支持 dense + sparse + 长文本。
          - listitem [ref=f231e528]:
            - strong [ref=f231e529]: OpenAI text-embedding-3-small 是英文通用 baseline
            - text: ：通用场景不易错。
          - listitem [ref=f231e530]:
            - strong [ref=f231e531]: pgvector 适合 < 1000 万向量 + 已有 Postgres
            - text: ：成本最低、生态成熟。
          - listitem [ref=f231e532]:
            - strong [ref=f231e533]: Milvus / Pinecone / Qdrant 适合 > 1000 万向量
            - text: ：按 K8s 能力、托管偏好、metadata 复杂度选择。
          - listitem [ref=f231e534]:
            - strong [ref=f231e535]: 选型后难换
            - text: ：上线前充分评测，避免被锁死。
