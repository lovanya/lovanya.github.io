        - heading "二、向量数据库怎么选" [level=2] [ref=f231e239]
        - paragraph [ref=f231e240]: 向量库管”如何快速找到相似向量”。生产里你需要关注 5 件事：
        - heading "5 维度" [level=3] [ref=f231e241]
        - list [ref=f231e242]:
          - listitem [ref=f231e243]:
            - strong [ref=f231e244]: 规模
            - text: ：10 万 / 100 万 / 1000 万 / 1 亿+ —— 决定用 Postgres 扩展还是独立向量库
          - listitem [ref=f231e245]:
            - strong [ref=f231e246]: 延迟
            - text: ：< 10ms（实时）/ < 100ms（近实时）/ 数百 ms（批处理）
          - listitem [ref=f231e247]:
            - strong [ref=f231e248]: 部署模式
            - text: ：自托管 / 云托管 / 嵌入式
          - listitem [ref=f231e249]:
            - strong [ref=f231e250]: 混合检索
            - text: ：是否原生支持 BM25 + 向量
          - listitem [ref=f231e251]:
            - strong [ref=f231e252]: 运维
            - text: ：监控 / 备份 / 多租户 / 权限
        - heading "5 个主流选项" [level=3] [ref=f231e253]
        - heading "选项 1：pgvector（Postgres 扩展）" [level=4] [ref=f231e254]
        - paragraph [ref=f231e255]:
          - link "pgvector" [ref=f231e256]:
            - /url: https://github.com/pgvector/pgvector
          - text: 是 Postgres 的向量扩展。
          - strong [ref=f231e257]: 最大优势：数据和向量在同一个数据库
          - text: 。
        - code [ref=f231e259]:
          - generic [ref=f231e260]: "-- 安装"
          - generic [ref=f231e261]: CREATE EXTENSION vector;
          - generic [ref=f231e262]: "-- 建表"
          - generic [ref=f231e263]: CREATE TABLE docs (
          - generic [ref=f231e264]: id BIGSERIAL PRIMARY KEY,
          - generic [ref=f231e265]: content TEXT,
          - generic [ref=f231e266]: metadata JSONB,
          - generic [ref=f231e267]: embedding vector(1536) -- OpenAI 1536 维
          - generic [ref=f231e268]: );
          - generic [ref=f231e269]: "-- 索引（HNSW 适合高召回，IVFFlat 适合快速构建）"
          - generic [ref=f231e270]: CREATE INDEX ON docs USING hnsw (embedding vector_cosine_ops);
          - generic [ref=f231e271]: "-- 检索"
          - generic [ref=f231e272]: SELECT id, content, metadata
          - generic [ref=f231e273]: FROM docs
          - generic [ref=f231e274]: WHERE metadata->>'category' = 'api' -- metadata 过滤
          - generic [ref=f231e275]: ORDER BY embedding <=> $1 -- 余弦距离
          - generic [ref=f231e276]: LIMIT 4;
        - paragraph [ref=f231e277]:
          - strong [ref=f231e278]: 优势
          - text: ：
        - list [ref=f231e279]:
          - listitem [ref=f231e280]: 已经在用 Postgres 的团队零基础设施成本
          - listitem [ref=f231e281]: 原生 JOIN / ACID / 事务
          - listitem [ref=f231e282]: 40+ 语言客户端
        - paragraph [ref=f231e283]:
          - strong [ref=f231e284]: 劣势
          - text: ：
        - list [ref=f231e285]:
          - listitem [ref=f231e286]:
            - text: 千万级以下性能好，
            - strong [ref=f231e287]: 亿级以上吃力
            - text: （需要 Citus / PgDog 分片）
          - listitem [ref=f231e288]: 高级 ANN 算法需要自己组合（binary quantization + iterative scan）
        - paragraph [ref=f231e289]:
          - strong [ref=f231e290]: 选 pgvector 的场景
          - text: ：
        - list [ref=f231e291]:
          - listitem [ref=f231e292]: 数据已经在 Postgres 里
          - listitem [ref=f231e293]: 总向量 < 1000 万
          - listitem [ref=f231e294]: 想用 metadata JOIN 关联业务表
        - heading "选项 2：Milvus（自托管，亿级）" [level=4] [ref=f231e295]
        - paragraph [ref=f231e296]:
          - link "Milvus" [ref=f231e297]:
            - /url: https://milvus.io/docs/overview.md
          - text: 走云原生路线，专门为大规模向量搜索设计：
        - list [ref=f231e298]:
          - listitem [ref=f231e299]:
            - strong [ref=f231e300]: 规模
            - text: ：已经验证支持
            - strong [ref=f231e301]: 数百亿向量
            - text: ，Salesforce / PayPal / NVIDIA 在用
          - listitem [ref=f231e302]:
            - strong [ref=f231e303]: 索引
            - text: ：HNSW / IVF / FLAT / SCANN / DiskANN + 量化 + GPU 加速（CAGRA）
          - listitem [ref=f231e304]:
            - strong [ref=f231e305]: 混合检索
            - text: ：dense + sparse + BM25 全文本检索 + reranking
          - listitem [ref=f231e306]:
            - strong [ref=f231e307]: 部署
            - text: ：Lite（笔记本） / Standalone（单机 Docker） / Distributed（K8s 亿级） / Zilliz Cloud（托管）
        - paragraph [ref=f231e308]:
          - strong [ref=f231e309]: 优势
          - text: ：规模、性能、混合检索、企业级特性齐
          - strong [ref=f231e310]: 劣势
          - text: ：K8s 运维门槛高，小团队用 Standalone 容易遇到资源瓶颈
        - paragraph [ref=f231e311]:
          - strong [ref=f231e312]: 选 Milvus 的场景
          - text: ：
        - list [ref=f231e313]:
          - listitem [ref=f231e314]: 数据规模 ≥ 1 亿向量
          - listitem [ref=f231e315]: 需要混合检索（dense + sparse + BM25）
          - listitem [ref=f231e316]: 有 K8s 运维能力
        - heading "选项 3：Pinecone（云托管）" [level=4] [ref=f231e317]
        - paragraph [ref=f231e318]: Pinecone 是 Serverless 风格的云原生向量库：
        - list [ref=f231e319]:
          - listitem [ref=f231e320]:
            - strong [ref=f231e321]: 优势
            - text: ：零运维、按需扩缩容、内置 embedding 模型（不用单独搭）
          - listitem [ref=f231e322]:
