            - text: ：供应商锁定、数据出境、单 GB 成本相对高
          - listitem [ref=f231e324]:
            - strong [ref=f231e325]: 特色
            - text: ：
            - strong [ref=f231e326]: document schema
            - text: 支持 dense + sparse + 全文本检索单索引混合
        - paragraph [ref=f231e327]:
          - strong [ref=f231e328]: 选 Pinecone 的场景
          - text: ：
        - list [ref=f231e329]:
